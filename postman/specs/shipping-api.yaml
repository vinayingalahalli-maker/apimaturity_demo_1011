openapi: 3.0.3
info:
  title: Shipping API
  description: |
    Manages shipment creation, tracking, and carrier integrations.
    This API is called by the **Orders API** when an order is confirmed,
    to create a shipment and generate a tracking number.
    
    **Who depends on this API:**
    - `Orders API` — calls `POST /shipments` when order status moves to `confirmed`
  version: 1.0.0
  contact:
    name: Logistics & Fulfillment Team
    email: logistics@example.com
tags:
  - name: Shipments
    description: Shipment lifecycle management
  - name: Tracking
    description: Shipment tracking and status updates
servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://{{shippingApiMockUrl}}
    description: Mock Server
paths:
  /shipments:
    get:
      tags: [Shipments]
      operationId: listShipments
      summary: List shipments
      parameters:
        - name: orderId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [label_created, picked_up, in_transit, out_for_delivery, delivered, exception]
        - name: carrier
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of shipments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
              example:
                data:
                  - shipmentId: "shp_xyz789"
                    orderId: "ord_abc123"
                    carrier: "UPS"
                    serviceLevel: "GROUND"
                    trackingNumber: "1Z999AA10123456784"
                    status: "in_transit"
                    estimatedDelivery: "2024-05-04"
                    labelUrl: "https://labels.example.com/shp_xyz789.pdf"
                    createdAt: "2024-05-01T10:05:00Z"
    post:
      tags: [Shipments]
      operationId: createShipment
      summary: Create a shipment
      description: |
        Creates a shipment for a confirmed order. Called by the **Orders API**
        after order confirmation. Selects optimal carrier, generates a shipping
        label, and returns a tracking number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
            example:
              orderId: "ord_abc123"
              destinationAddress:
                line1: "123 Main St"
                city: "Austin"
                state: "TX"
                zip: "78701"
                country: "US"
              items:
                - skuId: "SKU-9981"
                  quantity: 2
                  weightLbs: 1.2
              serviceLevel: "GROUND"
      responses:
        '201':
          description: Shipment created with tracking number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              example:
                shipmentId: "shp_xyz789"
                orderId: "ord_abc123"
                carrier: "UPS"
                serviceLevel: "GROUND"
                trackingNumber: "1Z999AA10123456784"
                status: "label_created"
                estimatedDelivery: "2024-05-04"
                labelUrl: "https://labels.example.com/shp_xyz789.pdf"
                createdAt: "2024-05-01T10:05:00Z"
        '422':
          description: Invalid address or undeliverable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /shipments/{shipmentId}:
    get:
      tags: [Shipments]
      operationId: getShipment
      summary: Get shipment details
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shipment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404':
          description: Shipment not found
  /shipments/{shipmentId}/tracking:
    get:
      tags: [Tracking]
      operationId: getTracking
      summary: Get real-time tracking events
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tracking event history
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipmentId:
                    type: string
                  trackingNumber:
                    type: string
                  carrier:
                    type: string
                  currentStatus:
                    type: string
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackingEvent'
              example:
                shipmentId: "shp_xyz789"
                trackingNumber: "1Z999AA10123456784"
                carrier: "UPS"
                currentStatus: "in_transit"
                events:
                  - timestamp: "2024-05-02T08:00:00Z"
                    status: "picked_up"
                    location: "Austin, TX"
                    description: "Package picked up by carrier"
                  - timestamp: "2024-05-02T18:00:00Z"
                    status: "in_transit"
                    location: "Dallas, TX"
                    description: "Departed UPS facility"
  /shipments/{shipmentId}/cancel:
    post:
      tags: [Shipments]
      operationId: cancelShipment
      summary: Cancel a shipment
      description: Voids the shipping label. Only valid before carrier pickup.
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shipment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipmentId:
                    type: string
                  status:
                    type: string
              example:
                shipmentId: "shp_xyz789"
                status: "cancelled"
        '409':
          description: Cannot cancel - already picked up
components:
  schemas:
    Shipment:
      type: object
      properties:
        shipmentId:
          type: string
        orderId:
          type: string
        carrier:
          type: string
          enum: [UPS, FedEx, USPS, DHL]
        serviceLevel:
          type: string
          enum: [GROUND, TWO_DAY, OVERNIGHT]
        trackingNumber:
          type: string
        status:
          type: string
          enum: [label_created, picked_up, in_transit, out_for_delivery, delivered, exception, cancelled]
        estimatedDelivery:
          type: string
          format: date
        labelUrl:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateShipmentRequest:
      type: object
      required: [orderId, destinationAddress, items]
      properties:
        orderId:
          type: string
        destinationAddress:
          $ref: '#/components/schemas/Address'
        items:
          type: array
          items:
            type: object
            properties:
              skuId:
                type: string
              quantity:
                type: integer
              weightLbs:
                type: number
        serviceLevel:
          type: string
          enum: [GROUND, TWO_DAY, OVERNIGHT]
          default: GROUND
    TrackingEvent:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: string
        location:
          type: string
        description:
          type: string
    Address:
      type: object
      properties:
        line1:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
