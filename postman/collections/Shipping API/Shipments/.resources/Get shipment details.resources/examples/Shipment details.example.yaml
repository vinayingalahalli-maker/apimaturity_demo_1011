$kind: http-example
request:
  url: "{{baseUrl}}/shipments/:shipmentId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    shipmentId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "shipmentId": "string",
        "orderId": "string",
        "carrier": "FedEx",
        "serviceLevel": "GROUND",
        "trackingNumber": "string",
        "status": "cancelled",
        "estimatedDelivery": "1993-09-09",
        "labelUrl": "string",
        "createdAt": "1963-06-18T02:18:14.164Z"
      }
order: 1000
