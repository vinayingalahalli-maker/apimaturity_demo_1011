$kind: http-example
request:
  url: "{{baseUrl}}/shipments/:shipmentId/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    shipmentId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "shipmentId": "shp_xyz789",
        "status": "cancelled"
      }
order: 1000
