$kind: http-example
request:
  url: "{{baseUrl}}/shipments?orderId=string&status=exception&carrier=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    orderId: string
    status: exception
    carrier: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "shipmentId": "shp_xyz789",
            "orderId": "ord_abc123",
            "carrier": "UPS",
            "serviceLevel": "GROUND",
            "trackingNumber": "1Z999AA10123456784",
            "status": "in_transit",
            "estimatedDelivery": "2024-05-04",
            "labelUrl": "https://labels.example.com/shp_xyz789.pdf",
            "createdAt": "2024-05-01T10:05:00Z"
          }
        ]
      }
order: 1000
