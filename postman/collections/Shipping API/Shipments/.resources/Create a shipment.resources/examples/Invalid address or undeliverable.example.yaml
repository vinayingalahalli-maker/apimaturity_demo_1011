$kind: http-example
request:
  url: "{{baseUrl}}/shipments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "orderId": "ord_abc123",
        "destinationAddress": {
          "line1": "123 Main St",
          "city": "Austin",
          "state": "TX",
          "zip": "78701",
          "country": "US"
        },
        "items": [
          {
            "skuId": "SKU-9981",
            "quantity": 2,
            "weightLbs": 1.2
          }
        ],
        "serviceLevel": "GROUND"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "message": "string"
      }
order: 2000
