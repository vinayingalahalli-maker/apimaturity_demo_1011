$kind: http-example
request:
  url: "{{baseUrl}}/shipments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "orderId": "ord_abc123",
        "destinationAddress": {
          "line1": "123 Main St",
          "city": "Austin",
          "state": "TX",
          "zip": "78701",
          "country": "US"
        },
        "items": [
          {
            "skuId": "SKU-9981",
            "quantity": 2,
            "weightLbs": 1.2
          }
        ],
        "serviceLevel": "GROUND"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "shipmentId": "shp_xyz789",
        "orderId": "ord_abc123",
        "carrier": "UPS",
        "serviceLevel": "GROUND",
        "trackingNumber": "1Z999AA10123456784",
        "status": "label_created",
        "estimatedDelivery": "2024-05-04",
        "labelUrl": "https://labels.example.com/shp_xyz789.pdf",
        "createdAt": "2024-05-01T10:05:00Z"
      }
order: 1000
