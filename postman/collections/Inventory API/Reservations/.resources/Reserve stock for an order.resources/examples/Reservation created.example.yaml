$kind: http-example
request:
  url: "{{baseUrl}}/inventory/reserve"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "orderId": "ord_abc123",
        "items": [
          {
            "skuId": "SKU-9981",
            "quantity": 2
          }
        ],
        "ttlSeconds": 900
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "reservationId": "res_001xyz",
        "orderId": "ord_abc123",
        "status": "active",
        "items": [
          {
            "skuId": "SKU-9981",
            "quantity": 2
          }
        ],
        "expiresAt": "2024-05-01T10:15:00Z"
      }
order: 1000
