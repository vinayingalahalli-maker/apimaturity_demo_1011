$kind: http-example
request:
  url: "{{baseUrl}}/inventory/reserve/:reservationId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    reservationId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "reservationId": "res_001xyz",
        "status": "released"
      }
order: 1000
