$kind: http-example
request:
  url: "{{baseUrl}}/inventory/:skuId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    skuId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "skuId": "SKU-9981",
        "productName": "Wireless Headphones",
        "quantityOnHand": 150,
        "quantityReserved": 12,
        "quantityAvailable": 138,
        "reorderThreshold": 20,
        "warehouseLocation": "BIN-A4-12"
      }
order: 1000
