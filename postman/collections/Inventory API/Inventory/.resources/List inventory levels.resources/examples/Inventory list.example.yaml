$kind: http-example
request:
  url: "{{baseUrl}}/inventory?skuId=string&lowStock=false"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: skuId
      value: string
    - key: lowStock
      value: "false"
      description: If true, returns only items below reorder threshold
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "skuId": "SKU-9981",
            "productName": "Wireless Headphones",
            "quantityOnHand": 150,
            "quantityReserved": 12,
            "quantityAvailable": 138,
            "reorderThreshold": 20,
            "warehouseLocation": "BIN-A4-12"
          }
        ]
      }
order: 1000
