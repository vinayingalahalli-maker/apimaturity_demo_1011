$kind: http-example
request:
  url: "{{baseUrl}}/orders"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "customerId": "cust_001",
        "items": [
          {
            "skuId": "SKU-9981",
            "quantity": 2
          }
        ],
        "shippingAddress": {
          "line1": "123 Main St",
          "city": "Austin",
          "state": "TX",
          "zip": "78701",
          "country": "US"
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "INSUFFICIENT_STOCK",
        "message": "SKU-9981 has only 1 unit available; 2 requested",
        "details": {
          "skuId": "SKU-9981",
          "requested": 2,
          "available": 1
        }
      }
order: 2000
