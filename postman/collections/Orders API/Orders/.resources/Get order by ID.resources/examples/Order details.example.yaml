$kind: http-example
request:
  url: "{{baseUrl}}/orders/:orderId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    orderId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "orderId": "ord_abc123",
        "customerId": "cust_001",
        "status": "shipped",
        "items": [
          {
            "skuId": "SKU-9981",
            "productName": "Wireless Headphones",
            "quantity": 2,
            "unitPrice": 79.99
          }
        ],
        "subtotal": 159.98,
        "tax": 12.8,
        "total": 172.78,
        "shippingAddress": {
          "line1": "123 Main St",
          "city": "Austin",
          "state": "TX",
          "zip": "78701",
          "country": "US"
        },
        "shipmentId": "shp_xyz789",
        "createdAt": "2024-05-01T10:00:00Z",
        "updatedAt": "2024-05-01T11:00:00Z"
      }
order: 1000
